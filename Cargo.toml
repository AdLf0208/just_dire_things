[package]
# Ported from: Just Dire Things 1.5.7 (Direwolf20-MC/JustDireThings, MIT),
# Minecraft Java 1.21.1 NeoForge. Clean-room Rust rewrite. Local-only until the
# maintainer approves publishing (ARCHITECTURE.md §8).
name = "mod-justdirethings"
version = "0.2.3"
edition = "2024"

[lib]
# The crate is the mod: `src/lib.rs` holds the one `impl Hooks`, and
# `src/runtime.rs` is the pure logic with its tests.

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
